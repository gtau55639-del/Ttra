        run: |
          set -euo pipefail
          cd "$DIR/android"
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASS:-}" ] && [ -n "${KS_ALIAS:-}" ]; then
            echo "Secret keystore ada -> build RELEASE bertanda tangan"
            ./gradlew --no-daemon assembleRelease
            unsigned="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
            [ -n "$unsigned" ] || { echo "::error::APK release tidak ditemukan"; exit 1; }
            ks="$RUNNER_TEMP/release.jks"
            echo "$KS_B64" | base64 -d > "$ks"
            bt="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n1)"
            "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
            KEY_PASS="${KEY_PASS:-$KS_PASS}" KS_PASS="$KS_PASS" \
              "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KS_ALIAS" \
                --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
                --out "$GITHUB_WORKSPACE/out/botlaunch-release.apk" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/botlaunch-release.apk" | head -n 3
            rm -f "$ks"
          else
            if [ -n "${KS_B64:-}${KS_PASS:-}${KS_ALIAS:-}" ]; then
              echo "::warning::Secret keystore TIDAK LENGKAP (butuh ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS). Build jatuh ke DEBUG."
            fi
            echo "Tidak ada secret keystore lengkap -> build DEBUG (tetap bisa dipasang di HP)"
            ./gradlew --no-daemon assembleDebug
            apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)"
            [ -n "$apk" ] || { echo "::error::APK debug tidak ditemukan"; exit 1; }
            cp "$apk" "$GITHUB_WORKSPACE/out/botlaunch-debug.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: botlaunch-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
